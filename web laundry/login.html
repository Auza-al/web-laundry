<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | PremiumCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-6">

    <div class="bg-slate-800 p-10 rounded-[2.5rem] w-full max-w-md border border-slate-700 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-blue-500 italic">PREMIUM<span class="text-white">CARE</span></h1>
            <p class="text-slate-400 text-sm mt-2">Masukkan kredensial untuk akses Admin</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase ml-4">Username</label>
                <input type="text" id="username" class="form-input mt-1" placeholder="admin" required>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase ml-4">Password</label>
                <input type="password" id="password" class="form-input mt-1" placeholder="••••••••" required>
            </div>
            
            <div id="loginError" class="hidden text-red-400 text-xs text-center bg-red-400/10 py-2 rounded-lg">
                Username atau password salah!
            </div>

            <button type="submit" class="w-full bg-blue-600 py-4 rounded-2xl text-white font-bold hover:bg-blue-500 transition shadow-xl shadow-blue-900/20">
                Masuk ke Dashboard
            </button>
        </form>
        
        <div class="mt-8 text-center">
            <a href="index.html" class="text-slate-500 text-sm hover:text-white transition">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('loginError');

            // Ganti username & password di sini
            if (user === "admin" && pass === "12345") {
                // Simpan status login sederhana di browser
                sessionStorage.setItem("isLoggedIn", "true");
                window.location.href = "admin.html";
            } else {
                error.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
